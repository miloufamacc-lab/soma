  rationale: "No explicit catalyst date; instead, monitor for ACCELERATING adoption vs baseline trend. Watch for inflection points where adoption rate rises materially above historical 5-7% annual growth."

action_trigger:
  baseline_monitoring: "Track private aviation fleet size and membership adoption. Accumulate related equities (NetJets parent Berkshire, Flexjet parent Directional Aviation, Wheels Up, JSX) if year-over-year adoption accelerates >15% in any 12-month period"
  inflection_alpha: "Increase conviction by 0.15 if autonomous eVTOL aircraft receive FAA certification (2027-2028) OR if membership-model fractional ownership crosses >20% of private aviation hours (from current ~5-10%)"
