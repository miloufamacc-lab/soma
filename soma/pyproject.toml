[project]
name = "soma"
version = "0.1.0"
description = "SOMA -- Shared Ontology for Market Analysis"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = [".."]
include = ["soma", "soma.*"]
