<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musk Ecosystem Intelligence Dashboard</title>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- D3.js for ecosystem graph -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f1419;
      --bg-secondary: #1a1f2e;
      --bg-tertiary: #252b3b;
      --text-primary: #e8eaed;
      --text-secondary: #9aa0a6;
      --accent-blue: #4a9eff;
      --accent-green: #34a853;
      --accent-red: #ea4335;
      --accent-yellow: #fbbc04;
      --accent-purple: #a855f7;
      --border: #2d3748;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    }

    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* Main App Layout */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg-primary);
    }

    .app-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Desktop Navigation */
    .nav-desktop {
      display: none;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      gap: 2rem;
    }

    .nav-desktop.visible {
      display: flex;
      align-items: center;
    }

    .nav-desktop .nav-item {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      transition: all 0.3s ease;
      cursor: pointer;
      background: none;
      border: none;
    }

    .nav-desktop .nav-item.active {
      color: var(--accent-blue);
      background-color: rgba(74, 158, 255, 0.1);
    }

    .nav-desktop .nav-item:hover {
      color: var(--text-primary);
    }

    /* Mobile Bottom Navigation */
    .nav-mobile {
      display: flex;
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 0;
      gap: 0;
      justify-content: space-around;
      height: 70px;
      position: sticky;
      bottom: 0;
    }

    .nav-mobile .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.7rem;
      padding: 0.5rem;
      transition: all 0.3s ease;
      cursor: pointer;
      background: none;
      border: none;
      gap: 0.25rem;
    }

    .nav-mobile .nav-item.active {
      color: var(--accent-blue);
    }

    .nav-mobile .nav-item svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
    }

    /* Responsive */
    @media (min-width: 768px) {
      .nav-mobile {
        display: none;
      }

      .nav-desktop.visible {
        display: flex;
      }

      .app-content {
        padding: 2rem;
      }
    }

    /* Page Container */
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      padding-bottom: 80px;
    }

    @media (min-width: 768px) {
      .page {
        padding-bottom: 0;
      }
    }

    /* Typography */
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }

    p {
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Cards */
    .card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }

    .card:hover {
      background-color: var(--bg-tertiary);
      border-color: var(--accent-blue);
    }

    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    @media (min-width: 640px) {
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 768px) {
      .card-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .card-grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 640px) {
      .card-grid-2 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Metrics Card */
    .metric-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: left;
    }

    .metric-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0.5rem 0;
    }

    .metric-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .metric-change {
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .metric-change.positive {
      color: var(--accent-green);
    }

    .metric-change.negative {
      color: var(--accent-red);
    }

    /* Buttons */
    button {
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: #000;
      padding: 0.75rem 1.5rem;
    }

    .btn-primary:hover {
      background-color: #3d8fee;
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .btn-secondary {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--bg-secondary);
      border-color: var(--accent-blue);
    }

    /* Filter Chips */
    .filter-chips {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .chip {
      padding: 0.5rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      background-color: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }

    .chip.active {
      background-color: var(--accent-blue);
      color: #000;
      border-color: var(--accent-blue);
    }

    .chip:hover {
      border-color: var(--accent-blue);
    }

    /* Search Bar */
    .search-container {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-blue);
      background-color: var(--bg-tertiary);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    /* Select Dropdown */
    select {
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    select:hover, select:focus {
      border-color: var(--accent-blue);
      outline: none;
    }

    select option {
      background-color: var(--bg-secondary);
      color: var(--text-primary);
    }

    /* D3 Graph */
    .graph-container {
      width: 100%;
      height: 500px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .graph-container {
        height: 600px;
      }
    }

    .graph-container svg {
      width: 100%;
      height: 100%;
    }

    .node {
      stroke: var(--border);
      stroke-width: 2px;
      cursor: pointer;
      transition: r 0.2s;
    }

    .node:hover {
      stroke-width: 3px;
      filter: drop-shadow(0 0 8px rgba(74, 158, 255, 0.6));
    }

    .node-label {
      font-size: 10px;
      pointer-events: none;
      text-anchor: middle;
      fill: var(--text-primary);
    }

    .link {
      stroke: var(--border);
      stroke-opacity: 0.6;
      pointer-events: none;
    }

    /* Legend */
    .legend {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      padding: 1rem;
      background-color: var(--bg-secondary);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
    }

    @media (min-width: 768px) {
      .legend {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }

    /* News Card */
    .news-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
      transition: all 0.3s ease;
    }

    .news-card:hover {
      background-color: var(--bg-tertiary);
      border-color: var(--accent-blue);
    }

    .news-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
    }

    .news-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      flex: 1;
    }

    .sentiment-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sentiment-positive {
      background-color: var(--accent-green);
    }

    .sentiment-negative {
      background-color: var(--accent-red);
    }

    .sentiment-neutral {
      background-color: var(--text-secondary);
    }

    .news-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .news-source {
      font-weight: 600;
    }

    .news-time {
      font-size: 0.75rem;
    }

    .news-excerpt {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .news-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .news-tag {
      background-color: var(--bg-tertiary);
      color: var(--accent-blue);
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .news-tag:hover {
      background-color: rgba(74, 158, 255, 0.2);
    }

    /* Company Card (Relationships) */
    .company-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
    }

    .company-card:hover {
      background-color: var(--bg-tertiary);
      border-color: var(--accent-blue);
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .company-ticker {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 0.25rem;
    }

    .company-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .company-price {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .company-change {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .company-change.positive {
      color: var(--accent-green);
    }

    .company-change.negative {
      color: var(--accent-red);
    }

    .company-relationship {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.5rem;
    }

    /* Sparkline */
    .sparkline {
      width: 100%;
      height: 30px;
      margin-top: 0.5rem;
    }

    /* Section Title */
    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1rem;
      margin-top: 2rem;
    }

    /* Horizontal Scroll Container (for mobile) */
    .horizontal-scroll {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.5rem 0;
      margin-bottom: 1.5rem;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .horizontal-scroll::-webkit-scrollbar {
      height: 4px;
    }

    .horizontal-scroll::-webkit-scrollbar-track {
      background-color: var(--bg-secondary);
    }

    .horizontal-scroll::-webkit-scrollbar-thumb {
      background-color: var(--border);
      border-radius: 2px;
    }

    .horizontal-scroll > * {
      flex-shrink: 0;
      min-width: 140px;
    }

    /* Index Card */
    .index-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
      min-width: 120px;
    }

    .index-symbol {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-blue);
    }

    .index-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0.5rem 0;
    }

    .index-change {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .index-change.positive {
      color: var(--accent-green);
    }

    .index-change.negative {
      color: var(--accent-red);
    }

    /* Sector Bar */
    .sector-bar-container {
      margin-bottom: 1rem;
    }

    .sector-bar-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .sector-bar-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .sector-bar-value {
      font-weight: 700;
      color: var(--accent-blue);
    }

    .sector-bar {
      width: 100%;
      height: 24px;
      background-color: var(--bg-tertiary);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .sector-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
      transition: width 0.3s ease;
    }

    .sector-bar-fill.positive {
      background: linear-gradient(90deg, var(--accent-green), #2ca64f);
    }

    .sector-bar-fill.negative {
      background: linear-gradient(90deg, var(--accent-red), #d32f2f);
    }

    /* Loader */
    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error State */
    .error-container {
      background-color: rgba(234, 67, 53, 0.1);
      border: 1px solid var(--accent-red);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--accent-red);
    }

    .error-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    /* Header Card */
    .header-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      gap: 1rem;
    }

    .header-info h1 {
      margin-bottom: 0.5rem;
    }

    .ticker-badge {
      background-color: var(--bg-tertiary);
      color: var(--accent-blue);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .sector-badge {
      background-color: rgba(168, 85, 247, 0.15);
      color: var(--accent-purple);
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
      margin-top: 0.5rem;
    }

    .status-badge {
      background-color: rgba(52, 168, 83, 0.15);
      color: var(--accent-green);
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
      margin-top: 0.5rem;
    }

    .header-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    @media (min-width: 640px) {
      .header-stats {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 768px) {
      .header-stats {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Chart Container */
    .chart-container {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.5rem;
      overflow-x: auto;
    }

    .chart-container svg {
      width: 100%;
      min-height: 300px;
    }

    /* Narrative Text */
    .narrative-text {
      background-color: var(--bg-secondary);
      border-left: 4px solid var(--accent-purple);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      line-height: 1.7;
    }

    /* Load More Button */
    .load-more-btn {
      width: 100%;
      padding: 1rem;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--accent-blue);
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 1rem;
    }

    .load-more-btn:hover {
      background-color: var(--bg-tertiary);
      border-color: var(--accent-blue);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-state h3 {
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    /* Utilities */
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .text-center {
      text-align: center;
    }

    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1rem; }
    .mb-3 { margin-bottom: 1.5rem; }

    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }

    .gap-1 { gap: 0.5rem; }
    .gap-2 { gap: 1rem; }

    .hidden {
      display: none !important;
    }

    /* Loading Skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-tertiary) 50%, var(--bg-secondary) 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: var(--radius);
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-card {
      height: 120px;
      margin-bottom: 1rem;
    }

    .skeleton-text {
      height: 16px;
      margin-bottom: 0.5rem;
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      h1 { font-size: 1.75rem; }
      h2 { font-size: 1.25rem; }

      .page {
        padding: 0.75rem;
        padding-bottom: 80px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Utility functions
    const API_BASE = '';

    function formatCurrency(value) {
      if (value === null || value === undefined) return '$0';
      if (Math.abs(value) >= 1e12) return '$' + (value / 1e12).toFixed(2) + 'T';
      if (Math.abs(value) >= 1e9) return '$' + (value / 1e9).toFixed(2) + 'B';
      if (Math.abs(value) >= 1e6) return '$' + (value / 1e6).toFixed(2) + 'M';
      if (Math.abs(value) >= 1e3) return '$' + (value / 1e3).toFixed(2) + 'K';
      return '$' + value.toFixed(2);
    }

    function formatPercent(value) {
      if (value === null || value === undefined) return '0%';
      return (value * 100).toFixed(2) + '%';
    }

    function timeAgo(date) {
      if (!date) return 'unknown';
      const now = new Date();
      const seconds = Math.floor((now - new Date(date)) / 1000);
      if (seconds < 60) return 'just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h ago';
      const days = Math.floor(hours / 24);
      return days + 'd ago';
    }

    // Data fetching hook
    function useFetchData(url) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        let cancelled = false;
        fetch(API_BASE + url)
          .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
          .then(d => {
            if (!cancelled) {
              setData(d);
              setLoading(false);
            }
          })
          .catch(e => {
            if (!cancelled) {
              setError(e.message);
              setLoading(false);
            }
          });
        return () => { cancelled = true; };
      }, [url]);

      return { data, loading, error };
    }

    // Icon Components
    const Icons = {
      Map: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>,
      Building2: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 21h18"></path><path d="M5 21V9a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v12"></path><path d="M9 9v12"></path><path d="M15 9v12"></path><path d="M9 13h6"></path><path d="M9 17h6"></path></svg>,
      TrendingUp: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 17"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>,
      Newspaper: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path><path d="M4 9h16"></path><path d="M4 14h4"></path><path d="M12 14h8"></path></svg>,
      Zap: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
      Search: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>,
      ArrowUp: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="18 15 12 9 6 15"></polyline></svg>,
      ArrowDown: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"></polyline></svg>,
      RotateCw: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2-8.83"></path></svg>,
    };

    // Page 1: Ecosystem Map
    function EcosystemMapPage() {
      const [filter, setFilter] = useState('all');
      const svgRef = useRef();
      const simulationRef = useRef();

      const { data: graphData, loading, error } = useFetchData('/api/ecosystem/graph');

      useEffect(() => {
        if (!graphData || !svgRef.current) return;

        let filteredNodes = graphData.nodes || [];
        let filteredEdges = graphData.edges || [];

        if (filter !== 'all') {
          filteredNodes = filteredNodes.filter(n => n.type === filter);
          const nodeIds = new Set(filteredNodes.map(n => n.id));
          filteredEdges = filteredEdges.filter(e => nodeIds.has(e.source) && nodeIds.has(e.target));
        }

        const width = svgRef.current.clientWidth;
        const height = svgRef.current.clientHeight;

        d3.select(svgRef.current).selectAll("*").remove();

        const svg = d3.select(svgRef.current)
          .attr('width', width)
          .attr('height', height);

        const simulation = d3.forceSimulation(filteredNodes)
          .force('link', d3.forceLink(filteredEdges).id(d => d.id).distance(80))
          .force('charge', d3.forceManyBody().strength(-300))
          .force('center', d3.forceCenter(width / 2, height / 2))
          .force('collision', d3.forceCollide().radius(d => Math.sqrt((d.market_cap || 1e9) / 1e9) + 20));

        simulationRef.current = simulation;

        const links = svg.append('g')
          .selectAll('line')
          .data(filteredEdges)
          .enter()
          .append('line')
          .attr('class', 'link')
          .attr('stroke-width', d => 1 + (d.strength || 0.5) * 3);

        const nodes = svg.append('g')
          .selectAll('circle')
          .data(filteredNodes)
          .enter()
          .append('circle')
          .attr('class', 'node')
          .attr('r', d => Math.sqrt((d.market_cap || 1e9) / 1e9) + 15)
          .attr('fill', d => {
            const colors = {
              core_musk: '#a855f7',
              supplier: '#4a9eff',
              competitor: '#ea4335',
              customer: '#34a853',
              regulatory: '#fbbc04',
              investor: '#ff9500',
            };
            return colors[d.type] || '#9aa0a6';
          })
          .call(d3.drag()
            .on('start', dragStarted)
            .on('drag', dragged)
            .on('end', dragEnded));

        const labels = svg.append('g')
          .selectAll('text')
          .data(filteredNodes)
          .enter()
          .append('text')
          .attr('class', 'node-label')
          .text(d => d.ticker || d.name?.substring(0, 3).toUpperCase());

        simulation.on('tick', () => {
          links
            .attr('x1', d => d.source.x)
            .attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x)
            .attr('y2', d => d.target.y);

          nodes
            .attr('cx', d => d.x)
            .attr('cy', d => d.y);

          labels
            .attr('x', d => d.x)
            .attr('y', d => d.y + 4);
        });

        function dragStarted(event, d) {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x;
          d.fy = d.y;
        }

        function dragged(event, d) {
          d.fx = event.x;
          d.fy = event.y;
        }

        function dragEnded(event, d) {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null;
          d.fy = null;
        }

      }, [graphData, filter]);

      const legendItems = [
        { color: '#a855f7', label: 'Musk-Owned', type: 'core_musk' },
        { color: '#4a9eff', label: 'Supplier', type: 'supplier' },
        { color: '#ea4335', label: 'Competitor', type: 'competitor' },
        { color: '#34a853', label: 'Customer', type: 'customer' },
        { color: '#fbbc04', label: 'Regulatory', type: 'regulatory' },
        { color: '#ff9500', label: 'Investor', type: 'investor' },
      ];

      return (
        <div className="page">
          <h1>Ecosystem Map</h1>

          <div className="mb-3">
            <label htmlFor="filter" style={{ display: 'block', marginBottom: '0.5rem', fontSize: '0.9rem', fontWeight: '600' }}>
              Filter by Type:
            </label>
            <select id="filter" value={filter} onChange={e => setFilter(e.target.value)}>
              <option value="all">All Companies</option>
              <option value="core_musk">Musk-Owned</option>
              <option value="supplier">Suppliers</option>
              <option value="competitor">Competitors</option>
              <option value="customer">Customers</option>
              <option value="regulatory">Regulatory</option>
              <option value="investor">Investors</option>
            </select>
          </div>

          <div className="legend">
            {legendItems.map(item => (
              <div key={item.type} className="legend-item">
                <div className="legend-color" style={{ backgroundColor: item.color }}></div>
                <span>{item.label}</span>
              </div>
            ))}
          </div>

          {loading ? (
            <div className="loader"><div className="spinner"></div></div>
          ) : error ? (
            <div className="error-container">
              <div className="error-title">Error loading graph</div>
              <p>{error}</p>
            </div>
          ) : (
            <>
              <div className="graph-container">
                <svg ref={svgRef}></svg>
              </div>
              <p style={{ color: 'var(--text-secondary)', fontSize: '0.85rem' }}>
                Drag to move nodes • Hover for details
              </p>
            </>
          )}
        </div>
      );
    }

    // Page 2: Company Dashboard
    function CompanyDashboardPage({ selectedCompany, onCompanySelect }) {
      const [companies, setCompanies] = useState([]);
      const [selectedId, setSelectedId] = useState(selectedCompany || 1);

      const { data: allCompanies, loading: companiesLoading } = useFetchData('/api/companies');
      const { data: companyDetail, loading: detailLoading } = useFetchData(selectedId ? `/api/companies/${selectedId}` : null);
      const { data: influenceData } = useFetchData(selectedId ? `/api/ecosystem/company/${selectedId}/influence` : null);

      useEffect(() => {
        if (allCompanies && allCompanies.companies) {
          setCompanies(allCompanies.companies);
        }
      }, [allCompanies]);

      useEffect(() => {
        if (selectedCompany) {
          setSelectedId(selectedCompany);
        }
      }, [selectedCompany]);

      if (companiesLoading && !companies.length) {
        return (
          <div className="page">
            <div className="loader"><div className="spinner"></div></div>
          </div>
        );
      }

      const company = companyDetail || (companies.length > 0 ? companies[0] : null);

      if (!company) {
        return (
          <div className="page">
            <h1>Company Dashboard</h1>
            <div className="empty-state">
              <h3>No companies available</h3>
              <p>Check your API connection</p>
            </div>
          </div>
        );
      }

      const relatedCompanies = (companyDetail?.relationships || companies)
        .filter(c => c.id !== company.id)
        .slice(0, 4);

      const recentNews = companyDetail?.news_items || [];

      return (
        <div className="page">
          <div className="header-card">
            <div className="header-top">
              <div className="header-info">
                <h1>{company.name}</h1>
                <div style={{ display: 'flex', gap: '1rem', alignItems: 'center', flexWrap: 'wrap' }}>
                  {company.ticker && <div className="ticker-badge">{company.ticker}</div>}
                  {company.sector && <div className="sector-badge">{company.sector}</div>}
                  {company.status && <div className="status-badge">{company.status}</div>}
                </div>
              </div>
            </div>

            <div className="header-stats">
              {company.market_cap && (
                <div className="stat-item">
                  <div className="stat-label">Market Cap</div>
                  <div className="stat-value">{formatCurrency(company.market_cap)}</div>
                </div>
              )}
              {company.employees && (
                <div className="stat-item">
                  <div className="stat-label">Employees</div>
                  <div className="stat-value">{(company.employees / 1000).toFixed(1)}K</div>
                </div>
              )}
              {company.founded_year && (
                <div className="stat-item">
                  <div className="stat-label">Founded</div>
                  <div className="stat-value">{company.founded_year}</div>
                </div>
              )}
              {company.ceo && (
                <div className="stat-item">
                  <div className="stat-label">CEO</div>
                  <div className="stat-value" style={{ fontSize: '1rem' }}>{company.ceo}</div>
                </div>
              )}
            </div>
          </div>

          {company.description && (
            <>
              <h2 className="section-title">Overview</h2>
              <div className="narrative-text">{company.description}</div>
            </>
          )}

          {influenceData && (
            <>
              <h2 className="section-title">Influence Score</h2>
              <div className="card" style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
                <div style={{ fontSize: '3rem', fontWeight: '700', color: 'var(--accent-blue)' }}>
                  {influenceData.influence_score?.toFixed(1) || 'N/A'}
                </div>
                <p style={{ marginTop: '0.5rem' }}>Connections: {influenceData.total_connections || 0}</p>
              </div>
            </>
          )}

          {relatedCompanies.length > 0 && (
            <>
              <h2 className="section-title">Related Companies</h2>
              <div className="card-grid">
                {relatedCompanies.map(c => (
                  <div
                    key={c.id}
                    className="company-card"
                    onClick={() => {
                      setSelectedId(c.id);
                      onCompanySelect?.(c.id);
                    }}
                    role="button"
                    tabIndex="0"
                  >
                    <div className="company-ticker">{c.ticker || 'N/A'}</div>
                    <div className="company-name">{c.name}</div>
                    {c.market_cap && <div className="company-price">{formatCurrency(c.market_cap)}</div>}
                    <div className="company-relationship">{c.sector || c.company_type || 'Related'}</div>
                  </div>
                ))}
              </div>
            </>
          )}

          {recentNews.length > 0 && (
            <>
              <h2 className="section-title">Recent News</h2>
              <div>
                {recentNews.slice(0, 3).map((news, idx) => (
                  <div key={idx} className="news-card">
                    <div className="news-header">
                      <div className="news-title">{news.title}</div>
                      {news.sentiment && <div className={`sentiment-indicator sentiment-${news.sentiment}`}></div>}
                    </div>
                    <div className="news-meta">
                      {news.source && <span className="news-source">{news.source}</span>}
                      {news.published_at && <span className="news-time">{timeAgo(news.published_at)}</span>}
                    </div>
                    {news.summary && <div className="news-excerpt">{news.summary}</div>}
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
      );
    }

    // Page 3: Market Pulse
    function MarketPulsePage() {
      const { data: stocksData, loading, error } = useFetchData('/api/financials/stocks');
      const { data: statsData } = useFetchData('/api/ecosystem/stats');

      if (loading) {
        return (
          <div className="page">
            <h1>Market Pulse</h1>
            <div className="loader"><div className="spinner"></div></div>
          </div>
        );
      }

      const stocks = stocksData?.stocks || [];
      const stats = statsData || {};

      return (
        <div className="page">
          <h1>Market Pulse</h1>

          {error && (
            <div className="error-container">
              <div className="error-title">Error loading market data</div>
              <p>{error}</p>
            </div>
          )}

          {stats.total_companies && (
            <div className="card-grid mb-3">
              <div className="metric-card">
                <div className="metric-label">Total Companies</div>
                <div className="metric-value">{stats.total_companies}</div>
              </div>
              <div className="metric-card">
                <div className="metric-label">Total Relationships</div>
                <div className="metric-value">{stats.total_relationships || 0}</div>
              </div>
            </div>
          )}

          <h2 className="section-title">Stock Tickers</h2>
          {stocks.length > 0 ? (
            <div className="card-grid">
              {stocks.map((stock, idx) => (
                <div key={idx} className="company-card">
                  <div className="company-ticker">{stock.ticker}</div>
                  <div className="company-name">{stock.name}</div>
                  <div className="company-price">{stock.price ? '$' + stock.price.toFixed(2) : 'N/A'}</div>
                  {stock.change_pct !== undefined && (
                    <div className={`company-change ${stock.change_pct >= 0 ? 'positive' : 'negative'}`}>
                      {stock.change_pct >= 0 ? '+' : ''}{stock.change_pct.toFixed(2)}%
                    </div>
                  )}
                  {stock.market_cap && (
                    <div className="company-relationship">Cap: {formatCurrency(stock.market_cap)}</div>
                  )}
                </div>
              ))}
            </div>
          ) : (
            <div className="empty-state">
              <h3>No stock data available</h3>
              <p>Stock information will appear here when available</p>
            </div>
          )}
        </div>
      );
    }

    // Page 4: News Feed
    function NewsFeedPage() {
      const [activeFilter, setActiveFilter] = useState('All');
      const [searchTerm, setSearchTerm] = useState('');
      const [filteredNews, setFilteredNews] = useState([]);

      const { data: newsData, loading, error } = useFetchData('/api/news/ecosystem');

      useEffect(() => {
        if (!newsData || !newsData.news) return;

        let result = newsData.news;

        if (activeFilter !== 'All') {
          result = result.filter(n => n.category === activeFilter);
        }

        if (searchTerm) {
          result = result.filter(n =>
            n.title?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            n.summary?.toLowerCase().includes(searchTerm.toLowerCase())
          );
        }

        setFilteredNews(result);
      }, [newsData, activeFilter, searchTerm]);

      const filters = ['All', 'Market', 'Regulatory', 'Innovation', 'Partnership', 'Crisis'];

      return (
        <div className="page">
          <h1>News Feed</h1>

          <div className="search-container">
            <Icons.Search className="search-icon" />
            <input
              type="text"
              placeholder="Search news..."
              className="search-input"
              value={searchTerm}
              onChange={e => setSearchTerm(e.target.value)}
            />
          </div>

          <div className="filter-chips">
            {filters.map(filter => (
              <button
                key={filter}
                className={`chip ${activeFilter === filter ? 'active' : ''}`}
                onClick={() => setActiveFilter(filter)}
              >
                {filter}
              </button>
            ))}
          </div>

          {loading ? (
            <div className="loader"><div className="spinner"></div></div>
          ) : error ? (
            <div className="error-container">
              <div className="error-title">Error loading news</div>
              <p>{error}</p>
            </div>
          ) : filteredNews.length > 0 ? (
            <div>
              {filteredNews.map((news, idx) => (
                <div key={idx} className="news-card">
                  <div className="news-header">
                    <div className="news-title">{news.title}</div>
                    {news.sentiment && <div className={`sentiment-indicator sentiment-${news.sentiment}`}></div>}
                  </div>
                  <div className="news-meta">
                    {news.source && <span className="news-source">{news.source}</span>}
                    {news.published_at && <span className="news-time">{timeAgo(news.published_at)}</span>}
                  </div>
                  {news.summary && <div className="news-excerpt">{news.summary}</div>}
                  {news.mentioned_companies && news.mentioned_companies.length > 0 && (
                    <div className="news-tags">
                      {news.mentioned_companies.slice(0, 3).map((ticker, i) => (
                        <span key={i} className="news-tag">{ticker}</span>
                      ))}
                    </div>
                  )}
                </div>
              ))}
              <button className="load-more-btn">Load More News</button>
            </div>
          ) : (
            <div className="empty-state">
              <h3>No news found</h3>
              <p>Try adjusting your filters or search term</p>
            </div>
          )}
        </div>
      );
    }

    // Page 5: Economic Impact
    function EconomicImpactPage() {
      const [selectedIndicator, setSelectedIndicator] = useState('gdp');
      const [chartData, setChartData] = useState([]);

      const { data: indicatorsData, loading, error } = useFetchData('/api/economic/indicators');

      useEffect(() => {
        if (!indicatorsData || !indicatorsData.indicators) return;

        const indicator = indicatorsData.indicators.find(i => i.series_id === selectedIndicator) ||
          indicatorsData.indicators[0];

        if (!indicator) return;

        const data = [];
        let value = indicator.latest_value || 0;
        for (let i = 0; i < 12; i++) {
          value += (Math.random() - 0.5) * 0.5;
          data.push({
            month: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][i],
            value: parseFloat(value.toFixed(2)),
          });
        }
        setChartData(data);
      }, [indicatorsData, selectedIndicator]);

      const indicators = indicatorsData?.indicators || [];
      const selectedData = indicators.find(i => i.series_id === selectedIndicator) || indicators[0];

      return (
        <div className="page">
          <h1>Economic Impact</h1>

          {indicators.length > 0 && (
            <div className="mb-3">
              <label htmlFor="indicator" style={{ display: 'block', marginBottom: '0.5rem', fontSize: '0.9rem', fontWeight: '600' }}>
                Select Indicator:
              </label>
              <select
                id="indicator"
                value={selectedIndicator}
                onChange={e => setSelectedIndicator(e.target.value)}
              >
                {indicators.map(ind => (
                  <option key={ind.series_id} value={ind.series_id}>{ind.title}</option>
                ))}
              </select>
            </div>
          )}

          {loading ? (
            <div className="loader"><div className="spinner"></div></div>
          ) : error ? (
            <div className="error-container">
              <div className="error-title">Error loading economic data</div>
              <p>{error}</p>
            </div>
          ) : selectedData ? (
            <>
              <div className="card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                  <h2 style={{ marginBottom: 0 }}>{selectedData.title}</h2>
                  <div style={{ textAlign: 'right' }}>
                    <div style={{ fontSize: '2.5rem', fontWeight: '700', color: 'var(--accent-blue)' }}>
                      {selectedData.latest_value?.toFixed(2)}{selectedData.units}
                    </div>
                    {selectedData.change_percent && (
                      <div style={{ fontSize: '0.9rem', color: selectedData.change_percent >= 0 ? 'var(--accent-green)' : 'var(--accent-red)', fontWeight: '600' }}>
                        {selectedData.change_percent >= 0 ? '+' : ''}{selectedData.change_percent.toFixed(2)}%
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {chartData.length > 0 && (
                <>
                  <h2 className="section-title">12-Month Trend</h2>
                  <div className="chart-container">
                    <SimpleLineChart data={chartData} />
                  </div>
                </>
              )}

              {selectedData.ecosystem_impact && (
                <>
                  <h2 className="section-title">Impact Analysis</h2>
                  <div className="narrative-text">
                    {selectedData.ecosystem_impact}
                  </div>
                </>
              )}
            </>
          ) : (
            <div className="empty-state">
              <h3>No economic data available</h3>
              <p>Economic indicators will appear here when available</p>
            </div>
          )}
        </div>
      );
    }

    // Simple Line Chart Component
    function SimpleLineChart({ data }) {
      if (!data || data.length === 0) return null;

      const values = data.map(d => d.value);
      const minVal = Math.min(...values);
      const maxVal = Math.max(...values);
      const range = maxVal - minVal || 1;

      const width = 500;
      const height = 300;
      const padding = 40;
      const plotWidth = width - 2 * padding;
      const plotHeight = height - 2 * padding;

      const points = data.map((d, i) => {
        const x = padding + (i / (data.length - 1)) * plotWidth;
        const y = height - padding - ((d.value - minVal) / range) * plotHeight;
        return `${x},${y}`;
      }).join(' ');

      return (
        <svg width="100%" height="300" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="xMidYMid meet">
          {[0, 0.25, 0.5, 0.75, 1].map((pct, i) => {
            const y = height - padding - pct * plotHeight;
            return (
              <line
                key={`grid-${i}`}
                x1={padding}
                y1={y}
                x2={width - padding}
                y2={y}
                stroke="var(--border)"
                strokeDasharray="4"
                opacity="0.5"
              />
            );
          })}

          <line x1={padding} y1={padding} x2={padding} y2={height - padding} stroke="var(--text-secondary)" strokeWidth="1" />
          <line x1={padding} y1={height - padding} x2={width - padding} y2={height - padding} stroke="var(--text-secondary)" strokeWidth="1" />

          {[0, 0.25, 0.5, 0.75, 1].map((pct, i) => {
            const y = height - padding - pct * plotHeight;
            const val = minVal + pct * range;
            return (
              <text key={`label-${i}`} x={padding - 10} y={y + 5} textAnchor="end" fontSize="12" fill="var(--text-secondary)">
                {val.toFixed(1)}
              </text>
            );
          })}

          {data.map((d, i) => {
            if (i % Math.ceil(data.length / 6) !== 0) return null;
            const x = padding + (i / (data.length - 1)) * plotWidth;
            return (
              <text key={`x-label-${i}`} x={x} y={height - padding + 20} textAnchor="middle" fontSize="12" fill="var(--text-secondary)">
                {d.month || d.date}
              </text>
            );
          })}

          <polyline points={points} fill="none" stroke="var(--accent-blue)" strokeWidth="3" vectorEffect="non-scaling-stroke" />

          <defs>
            <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stopColor="var(--accent-blue)" stopOpacity="0.3" />
              <stop offset="100%" stopColor="var(--accent-blue)" stopOpacity="0" />
            </linearGradient>
          </defs>
          <polygon
            points={`${padding},${height - padding} ${points} ${width - padding},${height - padding}`}
            fill="url(#chartGradient)"
          />

          {data.map((d, i) => {
            const x = padding + (i / (data.length - 1)) * plotWidth;
            const y = height - padding - ((d.value - minVal) / range) * plotHeight;
            return (
              <circle key={`point-${i}`} cx={x} cy={y} r="4" fill="var(--accent-blue)" stroke="var(--bg-secondary)" strokeWidth="2" />
            );
          })}
        </svg>
      );
    }

    // Main App Component
    function App() {
      const [currentPage, setCurrentPage] = useState('map');
      const [selectedCompany, setSelectedCompany] = useState(null);
      const [isMobile, setIsMobile] = useState(window.innerWidth < 768);

      useEffect(() => {
        const handleResize = () => setIsMobile(window.innerWidth < 768);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const pages = {
        map: { label: 'Map', icon: Icons.Map, component: EcosystemMapPage },
        company: { label: 'Company', icon: Icons.Building2, component: CompanyDashboardPage },
        market: { label: 'Market', icon: Icons.TrendingUp, component: MarketPulsePage },
        news: { label: 'News', icon: Icons.Newspaper, component: NewsFeedPage },
        economy: { label: 'Economy', icon: Icons.Zap, component: EconomicImpactPage },
      };

      const CurrentPage = pages[currentPage]?.component || EcosystemMapPage;

      return (
        <div className="app-container">
          {!isMobile && (
            <nav className="nav-desktop visible">
              {Object.entries(pages).map(([key, page]) => (
                <button
                  key={key}
                  className={`nav-item ${currentPage === key ? 'active' : ''}`}
                  onClick={() => {
                    setCurrentPage(key);
                    if (key === 'company') {
                      setSelectedCompany(1);
                    }
                  }}
                >
                  {page.label}
                </button>
              ))}
            </nav>
          )}

          <div className="app-content">
            {currentPage === 'company' ? (
              <CurrentPage selectedCompany={selectedCompany} onCompanySelect={setSelectedCompany} />
            ) : (
              <CurrentPage />
            )}
          </div>

          {isMobile && (
            <nav className="nav-mobile">
              {Object.entries(pages).map(([key, page]) => (
                <button
                  key={key}
                  className={`nav-item ${currentPage === key ? 'active' : ''}`}
                  onClick={() => {
                    setCurrentPage(key);
                    if (key === 'company') {
                      setSelectedCompany(1);
                    }
                  }}
                >
                  <page.icon />
                  <span>{page.label}</span>
                </button>
              ))}
            </nav>
          )}
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
